name: CI
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DONKA_DOCS_SOURCES_DIR: ${{ github.workspace }}/.sources
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned product source refs
        id: source_refs
        run: node scripts/source-refs.mjs
      - name: Checkout Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: youmssi/donka
          ref: ${{ steps.source_refs.outputs.studio }}
          path: .sources/studio
          persist-credentials: false
      - name: Checkout Runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: youmssi/donka-runtime
          ref: ${{ steps.source_refs.outputs.runtime }}
          path: .sources/donka-runtime
          persist-credentials: false
      - name: Checkout CLI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: youmssi/donka-cli
          ref: ${{ steps.source_refs.outputs.cli }}
          path: .sources/donka-cli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned pnpm locally
        run: |
          npm install --prefix .tools --no-package-lock pnpm@10.33.0
          echo "$PWD/.tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build the tagged CLI command reference
        run: |
          pnpm --dir .sources/donka-cli install --frozen-lockfile
          pnpm --dir .sources/donka-cli build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Export the tagged Runtime OpenAPI document
        run: cargo run --manifest-path .sources/donka-runtime/Cargo.toml --locked --example export-openapi > .sources/donka-runtime/openapi.json
        env:
          SERVICE_VERSION: ${{ steps.source_refs.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm test
      - run: pnpm audit:security
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          DONKA_DOCS_SOURCES_DIR: ${{ github.workspace }}/.sources
      - run: pnpm check:links
      - run: pnpm test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
